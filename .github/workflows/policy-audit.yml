name: Policy audit
on:
  schedule:
    - cron: '23 9 * * 1'
  push:
    paths:
      - '.repo-standard.json'
      - '.repo-standard-source.json'
      - 'mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apply-ruleset.sh'
      - 'policy/**'
      - 't3.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'ruleset.json'
      - 'greptile.json'
      - '.coderabbit.yaml'
      - '.claude/settings.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.githooks/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch canonical source without changing this checkout
        env:
          GH_TOKEN: ${{ secrets.REPO_STANDARD_READ_TOKEN || github.token }}
        run: gh repo clone sshickles/repo-standard "$RUNNER_TEMP/canonical-standard"
      - name: Install committed hook path for structure validation
        run: git config core.hooksPath .githooks
      - name: Report planned update without applying files or live settings
        env:
          CANONICAL_SOURCE: ${{ runner.temp }}/canonical-standard
        run: |
          audit_status=0
          python3 scripts/repository.py audit . --source "$CANONICAL_SOURCE" --revision HEAD > policy-audit.txt 2>&1 || audit_status=$?
          cat policy-audit.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-audit
          path: policy-audit.txt
