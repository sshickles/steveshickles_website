# Generated from sshickles/repo-standard. A backstop, not the enforcement: the
# pre-push hook and the GitHub ruleset reject these operations for real.
# Each expression is tested against one shell command at a time, as it appears
# in the JSON arguments: a double quote is written \" there. A rule applies
# wherever git or gh stands outside quotes, with push or pr merge as its
# subcommand and only options between them. Option values may be quoted. A
# backslash and the character it escapes are read as one unit, so an escaped
# quote neither opens nor closes a quoted argument. A command that merely
# mentions a push, such as a history search or a commit message, is not denied.

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)*(?:(?<![A-Za-z0-9_-])git|(?<=[^\\]\\[nrt])git|\\"git\\"|\x27git\x27)(?:\s+(?:(?:-[cC]|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|config-env|attr-source))\s+(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+|-(?:(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+)?))*\s+(?:push|\\"push\\"|\x27push\x27)(?![A-Za-z0-9_-])[^\x00;&|]*\s(?:--force|-[a-zA-Z]*f)'
decision = "deny"
priority = 900
denyMessage = "Force pushes are not allowed. Merge the default branch into the task branch and push normally."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)*(?:(?<![A-Za-z0-9_-])git|(?<=[^\\]\\[nrt])git|\\"git\\"|\x27git\x27)(?:\s+(?:(?:-[cC]|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|config-env|attr-source))\s+(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+|-(?:(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+)?))*\s+(?:push|\\"push\\"|\x27push\x27)(?![A-Za-z0-9_-])[^\x00;&|]*\s[\\"\x27]*\+[^\s]'
decision = "deny"
priority = 900
denyMessage = "Forced refspec pushes are not allowed."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)*(?:(?<![A-Za-z0-9_-])git|(?<=[^\\]\\[nrt])git|\\"git\\"|\x27git\x27)(?:\s+(?:(?:-[cC]|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|config-env|attr-source))\s+(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+|-(?:(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+)?))*\s+(?:push|\\"push\\"|\x27push\x27)(?![A-Za-z0-9_-])[^\x00;&|]*\s--no-verify\b'
decision = "deny"
priority = 900
denyMessage = "Do not skip the pre-push hook. Fix the failing check."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)*(?:(?<![A-Za-z0-9_-])git|(?<=[^\\]\\[nrt])git|\\"git\\"|\x27git\x27)(?:\s+(?:(?:-[cC]|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|config-env|attr-source))\s+(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+|-(?:(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+)?))*\s+(?:push|\\"push\\"|\x27push\x27)(?![A-Za-z0-9_-])[^\x00;&|]*(?:[\s:+"\x27]|[\s:+"\x27]refs/heads/)dev(?=[\s"\x27\\;&|)]|$)'
decision = "deny"
priority = 900
denyMessage = "Never push to the default branch. Push the task branch and open a pull request."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)*(?:(?<![A-Za-z0-9_-])gh|(?<=[^\\]\\[nrt])gh|\\"gh\\"|\x27gh\x27)(?:\s+(?:(?:-R|--repo|--hostname)\s+(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+|-(?:(?:[^\s;&|"\x27\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\]|\\"(?:[^\x00"\\]|\\\\(?:\\\\|\\"|\\[^"\\]|[^\x00\\])|\\[^"\\])*\\"|\x27[^\x00\x27]*\x27)+)?))*\s+(?:pr|\\"pr\\"|\x27pr\x27)\s+(?:merge|\\"merge\\"|\x27merge\x27)(?![A-Za-z0-9_-])[^\x00;&|]*\s--admin\b'
